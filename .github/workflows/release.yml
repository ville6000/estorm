name: Release

# Push a tag like v0.2.0 (matching package.json), with `npm version`, to
# publish the package to npm and estorm.html as a GitHub release asset, then
# deploy the editor to GitHub Pages.
#
# npm publishing uses trusted publishing (OIDC), so there is no token: the
# package's settings on npmjs.com trust this workflow in ville6000/estorm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish to npm
        run: npm publish
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/web/estorm.html --title "$GITHUB_REF_NAME" --generate-notes

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
