name: Pages

# Publishes the browser editor to GitHub Pages. The release workflow calls
# this once a release succeeds, so the hosted version always matches the
# latest release. Run it by hand on a tag ("Run workflow", pick the tag) to
# republish an existing release.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions. If deployments
# from tags are refused, allow `v*` tags under Settings -> Environments ->
# github-pages -> Deployment branches and tags.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare site
        run: |
          mkdir -p site
          cp dist/web/estorm.html site/index.html
          cp dist/web/estorm.html site/estorm.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
